# Water-value bidding: SDP over a SOC grid (optim/sdp.py) -> offer curves (bidding/).

soc_levels: 101                        # SOC grid points from soc_min to soc_max (1 MWh steps here)
terminal_penalty_sgd_per_mwh: 10000    # per MWh below soc_init at the end of the delivery day
                                       # (same end-of-day rule as the self-schedule baseline)

# How the SDP sees prices across stages (bidding/stages.py):
#   independent  stagewise marginals of the copula scenarios: ignores that prices persist, so the
#                SDP sees fake spreads (expects 25 M SGD on a year where perfect foresight makes 16 M)
#   markov       price states from the quantile forecasts, persisting with lag-1 correlation rho
#                (forecast/markov.py); offer curves = the optimal response to each price
# 12 months (daily issues): independent 6.98 M, markov 7.77 M (copula rho) SGD
price_model: markov
markov:
  states: 11       # equal-probability price states per stage
  rho: null        # lag-1 correlation; null: walk-forward copula of each month (~0.77)

# Offer only tranches that could clear: discharge priced <= the highest scenario price of the
# interval (+ margin), charge priced >= the lowest (- margin). Unoffered capacity is not counted
# in the worst-case SOC of later intervals (gate closure), so it stays available to them.
price_band_margin_sgd_per_mwh: 0.0

# Price sweep sanity check (bidding/sweep.py): re-solve each interval at these prices and compare
# with what the submitted offers clear.
sweep:
  price_min: -100
  price_max: 2000
  price_step: 10

# Gate-closure feasibility of tranche sizes (bidding/feasibility.py):
#   worst_case     every pending tranche may clear: never infeasible, conservative
#   probabilistic  SOC after the pending offers at the soc_quantile / 1 - soc_quantile of the
#                  scenarios, widened by margin_pct of usable capacity; rare shortfalls are
#                  settled by the simulator at market.shortfall_penalty
#   market         no SoC caps: the market engine cuts schedules to the real SoC (NEMS RC386,
#                  market.storage_rules.enforce_soc; with pooled rules shortfalls are penalised)
# 12 months half-hourly, NEMS rules: energy only market 9.40 M vs worst_case 8.69 M; with
# ancillary (SDP reserves) market 34.19 M vs worst_case 33.55 M SGD
feasibility:
  mode: market
  soc_quantile: 0.05
  margin_pct: 5.0

# With ancillary services (bidding run --ancillary): reserves are committed from a plan.
#   true   reserves fit beside any energy flow (raise + discharge <= P)
#   false  the plan may hold more than P of raise by charging; that charge is committed
#          price-taking (clears at any price)
firm_reserves: true           # 12 months, Markov: firm 24.53 M vs hybrid 24.39 M SGD (within noise;
                              # independent prices had hybrid ahead, 23.80 vs 23.62 M): firm is simpler

# Who chooses the reserves (with --ancillary):
#   milp             MILP plan on the mean stage price commits them, the SDP gets the rest
#   sdp              the SDP chooses them per stage, SOC and energy action (optim/reserves.py)
#   stochastic_milp  two-stage MILP: reserves vs stochastic_paths sampled price paths
# 12 months half-hourly (market feasibility): sdp 34.19 M, milp 32.99 M; self-schedule 33.43 M
reserve_planner: sdp
stochastic_paths: 20
stochastic_relax: false       # LP relaxation of the stochastic plan (~6x faster)
ancillary_price: median       # water value's reserve prices: median | mean (revenue is linear: mean)
reserve_prices: point         # point (one forecast per stage) | markov (reserve price states)
reserve_markov:               # one common reserve factor (fit on 2025-26 forecast errors)
  states: 5
  rho: 0.75
  loadings: {regulation: 0.63, primary_reserve: 0.45, contingency_reserve: 0.78}
record_plans: true            # save what each strategy planned at every decision (plans.parquet)
