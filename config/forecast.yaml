# Probabilistic USEP forecasting (Chronos-2) and scenario generation.

model_id: amazon/chronos-2
device: cuda                 # cuda | cpu
cuda_visible_devices: "1"    # GPU used (overridden by an existing CUDA_VISIBLE_DEVICES)
batch_size: 64

context_days: 28             # history given to the model per forecast (28 * 48 intervals)
prediction_length: 48        # intervals of the delivery day forecast
issue_lead_intervals: 2      # forecast for delivery day D is issued this many intervals before D 00:00
                             # (= gate closure of its first interval); uses data strictly before then
quantile_levels: [0.01, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.99]  # Chronos-2 native grid

# Covariate groups (forecast/covariates.py). demand is past-only: no archived demand forecasts.
# weather = Open-Meteo forecasts issued the day before (previous_day1), i.e. a real day-ahead lead.
covariates: [calendar, regime, demand, weather]

# Weather covariates: Open-Meteo previous-runs (archived day-ahead forecasts), processed to 30-min
# intervals. Every transform is recorded in data/processed/weather/report.json.
weather:
  # As-of weather: for an issue time T, the latest run r with r + availability_delay_h <= T.
  # Open-Meteo single-runs API; only ecmwf_ifs keeps a run archive back to 2024.
  model: ecmwf_ifs            # provider used for the forecast features (ECMWF IFS 9 km)
  availability_delay_h: 8     # a run is usable this long after its nominal start
  run_hours_utc: [0, 6, 12, 18]
  forecast_days: 2            # trajectory length kept per run
  archive_models:             # providers whose runs are archived daily (cron); history only
    - ecmwf_ifs               # for ecmwf_ifs, the others keep recent runs only
    - ecmwf_ifs025
    - icon_global
    - gfs_seamless
    - jma_seamless
    - cma_grapes_global
    - meteofrance_arpege_world

  grid:                       # 3 x 3 points over Singapore island
    latitudes: [1.25, 1.35, 1.45]
    longitudes: [103.65, 103.825, 104.0]

  variables:                  # Open-Meteo variable: aggregation of the 15-min steps per 30-min interval
    temperature_2m: mean
    relative_humidity_2m: mean
    cloud_cover: mean
    shortwave_radiation: mean
    precipitation: sum

  gap_fill:
    method: linear            # none | linear (in time, per point and variable, on the 15-min grid)
    max_gap_steps: 4          # fill gaps of at most N consecutive 15-min steps (1 hour); longer stay missing

spike_quantile: 0.95         # spike = realised USEP in the top 5% of the evaluation window

scenarios:
  calibration_days: 90       # copula correlation fitted on PITs of the preceding N days
  shrinkage: 0.1             # correlation shrinkage towards identity
  n_samples: 1000            # copula paths sampled per day before reduction
  n_scenarios: 30            # k-medoids reduction target (20-50 per CLAUDE.md)
  n_spike: 3                 # highest-price paths always kept as scenarios
  seed: 0
